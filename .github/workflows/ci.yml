# En cada push a main y en cada pull request:
#  - check: lint, formato, tipos, tests del frontend y compilación.
#  - database: aplica las migraciones en un PostgreSQL de Supabase y ejecuta las pruebas pgTAP.
# Las pruebas end-to-end se añadirán a la CI en la fase 8.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      # Solo el contenedor de PostgreSQL: aplica todas las migraciones desde cero.
      - run: supabase db start
      - run: supabase test db
